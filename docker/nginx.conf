server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;

    # Имена файлов сборки содержат хеш — их можно кешировать навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html всегда перепроверяется, чтобы новая сборка была видна сразу
    location / {
        add_header Cache-Control "no-cache";
    }
}
